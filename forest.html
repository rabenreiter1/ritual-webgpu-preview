<!doctype html><meta charset=utf-8><title>hero</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style><canvas></canvas><script>// ============================================================================
// noise bake, brush (cloud holes, mirror wipe), bloom chain, final pass
// ============================================================================
// 256² tileable noise, 16 cells across: r, g gradient noise; b cellular distance; a white noise
const W_NOISE = /*wgsl*/`
@group(0) @binding(0) var o: texture_storage_2d<rgba8unorm, write>;
fn pcg(v: u32) -> u32 { let s = v * 747796405u + 2891336453u; let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
fn hh(c: vec2i, s: u32) -> f32 { let w = (c % vec2i(16) + vec2i(16)) % vec2i(16); return f32(pcg(u32(w.x) + pcg(u32(w.y) + s * 7919u))) / 4294967295.; }
fn gn(p: vec2f, s: u32) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p); let u = f * f * f * (f * (f * 6. - 15.) + 10.);
  var v = array<f32, 4>();
  for (var k = 0; k < 4; k++) {
    let o = vec2i(k & 1, k >> 1); let a = hh(i + o, s) * 6.2831853;
    v[k] = dot(vec2f(cos(a), sin(a)), f - vec2f(o));
  }
  return mix(mix(v[0], v[1], u.x), mix(v[2], v[3], u.x), u.y);
}
fn wor(p: vec2f) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p); var d = 9.;
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let o = vec2i(x, y); let c = vec2f(hh(i + o, 3u), hh(i + o, 5u));
    d = min(d, length(vec2f(o) + c - f));
  } }
  return d;
}
@compute @workgroup_size(8, 8) fn main(@builtin(global_invocation_id) g: vec3u) {
  let p = (vec2f(g.xy) + .5) / 16.;
  let w = vec4f(gn(p, 1u) * .75 + .5, gn(p, 2u) * .75 + .5, saturate(wor(p) / 1.1), hh(vec2i(g.xy), 9u));
  textureStore(o, g.xy, saturate(w));
}
`;
// one stroke of the brush into the mask: a capsule from a to b, soft edge, blended with max
const W_BRUSH = /*wgsl*/`
struct B { ab: vec4f, rs: vec4f }
@group(0) @binding(0) var<uniform> b: B;
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let s = vec2f(b.rs.z, 1.);
  let pa = (i.uv - b.ab.xy) * s; let ba = (b.ab.zw - b.ab.xy) * s;
  let h = saturate(dot(pa, ba) / max(dot(ba, ba), 1e-8));
  let d = length(pa - ba * h);
  let v = smoothstep(b.rs.x, b.rs.x * .35, d) * b.rs.y;
  return vec4f(v, v, v, v);
}
`;
const W_BLIT = /*wgsl*/`
@group(0) @binding(0) var t: texture_2d<f32>;
@group(0) @binding(1) var s: sampler;
@group(0) @binding(2) var<uniform> sc: vec4f;      // x, y: share of the source that holds the image
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(t, s, uv * sc.xy, 0.).rgb; }
// first step down: a weighted 4-tap that keeps single bright pixels from flickering
@fragment fn fsDown0(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t)) / sc.xy;
  var c = vec3f(0.); var w = 0.;
  for (var k = 0; k < 4; k++) {
    let o = vec2f(f32(k & 1) - .5, f32(k >> 1) - .5) * px * 2.;
    let v = min(tap(i.uv + o), vec3f(60.)); let ww = 1. / (1. + dot(v, vec3f(.2126, .7152, .0722)));
    c += v * ww; w += ww;
  }
  return vec4f(c / w, 1.);
}
@fragment fn fsCopy(i: VO) -> @location(0) vec4f { return vec4f(tap(i.uv), 1.); }
@fragment fn fsDown(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t));
  var c = vec3f(0.);
  for (var k = 0; k < 4; k++) { c += tap(i.uv + vec2f(f32(k & 1) - .5, f32(k >> 1) - .5) * px * 2.); }
  return vec4f(c * .25, 1.);
}
@fragment fn fsUp(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t));
  var c = vec3f(0.);
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let w = (2. - abs(f32(x))) * (2. - abs(f32(y)));
    c += tap(i.uv + vec2f(f32(x), f32(y)) * px) * w;
  } }
  return vec4f(c / 16., 1.);
}
`;
const W_POST = /*wgsl*/`
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var tS: texture_2d<f32>;
@group(0) @binding(2) var tB: texture_2d<f32>;
@group(0) @binding(3) var tL: texture_2d<f32>;
@group(0) @binding(4) var sc: sampler;
struct U { res: vec4f, tm: vec4f, cp: vec4f, ct: vec4f, pt: vec4f, a: vec4f, b: vec4f, c: vec4f, d: vec4f,
  c0: vec4f, c1: vec4f, c2: vec4f, c3: vec4f, fx: vec4f, fx2: vec4f, sun: vec4f }
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
fn aces(x: vec3f) -> vec3f { return saturate(x * (2.51 * x + .03) / (x * (2.43 * x + .59) + .14)); }
fn srgb(c: vec3f) -> vec3f { return select(1.055 * pow(c, vec3f(1. / 2.4)) - .055, c * 12.92, c < vec3f(.0031308)); }
fn hsh(p: vec2f) -> f32 { var q = fract(p * vec2f(.1031, .1030)); q += dot(q, q.yx + 33.33); return fract((q.x + q.y) * q.x); }
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let dim = vec2f(textureDimensions(tS));
  let s = u.res.xy / dim;
  let uv = i.uv;
  // upscale with a light sharpen (the scene renders at a dynamic resolution)
  let px = 1. / dim;
  let c0 = textureSampleLevel(tS, sc, uv * s, 0.).rgb;
  let nb = textureSampleLevel(tS, sc, uv * s + vec2f(px.x, 0.), 0.).rgb + textureSampleLevel(tS, sc, uv * s - vec2f(px.x, 0.), 0.).rgb
         + textureSampleLevel(tS, sc, uv * s + vec2f(0., px.y), 0.).rgb + textureSampleLevel(tS, sc, uv * s - vec2f(0., px.y), 0.).rgb;
  var c = max(c0 + (c0 - nb * .25) * .3, vec3f(0.));
  let low = textureSampleLevel(tL, sc, uv, 0.).rgb;
  c = mix(c, low, saturate(u.fx.w));
  c += textureSampleLevel(tB, sc, uv, 0.).rgb * u.fx2.w;
  // steam over the whole frame (before the pull-back reveals the mirror)
  if (u.fx2.x > .001) {
    let asp = u.res.x / u.res.y;
    let q = vec2f(uv.x * asp, uv.y) * 28.; let id = floor(q);
    let o = vec2f(hsh(id), hsh(id + 7.1));
    let dd = length(fract(q) - .5 - (o - .5) * .5); let rr = .12 + .22 * o.y;
    let drop = smoothstep(rr, rr - .08, dd) * step(.6, o.x) * saturate(u.fx2.x * 2. - .6) * .6;
    let edge = length((uv - .5) * vec2f(asp, 1.));
    let f = saturate(u.fx2.x * 1.7 - (.9 - edge) * .9);
    let fogc = mix(low, vec3f(lum3(low)), .5) * .55 + vec3f(.45);
    c = mix(c, fogc, f * (1. - drop * .7)) + vec3f(.25) * drop * f * smoothstep(rr * .45, 0., dd + rr * .3);
  }
  c *= u.fx.x;
  c = aces(c);
  let v = (uv - .5) * vec2f(u.res.x / u.res.y, 1.);
  c *= 1. - u.fx2.y * smoothstep(.35, 1.2, length(v));
  c = mix(c, vec3f(1.), saturate(u.fx.y));
  c = mix(c, vec3f(0.), saturate(u.fx.z));
  c = srgb(c);
  let n = hsh(i.pos.xy + fract(u.tm.x * 7.13) * 91.7) - .5;
  c += n * (1. / 255. + u.fx2.z * .035);
  return vec4f(c, 1.);
}
fn lum3(c: vec3f) -> f32 { return dot(c, vec3f(.2126, .7152, .0722)); }
`;

// ============================================================================
// hero 1 · the bamboo forest (metres, Y up): thousands of instanced culms, hundreds of thousands of leaves,
// a littered floor, morning mist, a sun shadow map and light shafts through the canopy.
// Techniques after Abyssal Garden (MIT, © 2026 Maksymilian Dendura): instanced strips bent in the vertex
// shader, shadow-mapped sun, physically based height fog, half-res shafts marched through the shadow map.
// ============================================================================
const HF_G = /*wgsl*/`
struct G { vp: mat4x4f, sm: mat4x4f, cam: vec4f, right: vec4f, up: vec4f, fwd: vec4f, sun: vec4f, res: vec4f, mis: vec4f, ex: vec4f };
@group(0) @binding(0) var<uniform> g: G;
@group(0) @binding(1) var sR: sampler;
@group(0) @binding(2) var sS: sampler_comparison;
@group(0) @binding(3) var tSh: texture_depth_2d;
@group(0) @binding(4) var tN: texture_2d<f32>;
const PI = 3.14159265;
const SUNC = vec3f(2.6, 2.2, 1.6);
fn sat(x: f32) -> f32 { return clamp(x, 0., 1.); }
fn ss(a: f32, b: f32, x: f32) -> f32 { let t = clamp((x - a) / (b - a), 0., 1.); return t * t * (3. - 2. * t); }
fn hs(x: f32) -> f32 { return fract(sin(x * 127.1) * 43758.5453); }
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(.06711056, .00583715)))); }
fn nz(p: vec2f) -> vec4f { return textureSample(tN, sR, p * .0625); }
fn nzl(p: vec2f) -> vec4f { return textureSampleLevel(tN, sR, p * .0625, 0.); }
fn shUV(p: vec3f) -> vec3f { let s = g.sm * vec4f(p, 1.); return vec3f(s.x * .5 + .5, .5 - s.y * .5, s.z - .0012); }
fn shadow4(p: vec3f) -> f32 {
  let s = shUV(p); let e = 1.5 / 2048.;
  if (any(s.xy < vec2f(0.)) || any(s.xy > vec2f(1.))) { return 1.; }
  return (textureSampleCompareLevel(tSh, sS, s.xy + vec2f(-e, -e), s.z) + textureSampleCompareLevel(tSh, sS, s.xy + vec2f(e, -e), s.z)
        + textureSampleCompareLevel(tSh, sS, s.xy + vec2f(-e, e), s.z) + textureSampleCompareLevel(tSh, sS, s.xy + vec2f(e, e), s.z)) * .25;
}
// morning mist: height fog that scatters the sun forward, a cool sky light from above
const FOGC = vec3f(.25, .33, .25);
fn canopy(y: f32) -> f32 { return mix(.22, 1., ss(3., 22., y)); }
fn skyAmb(n: vec3f) -> vec3f { return mix(vec3f(.05, .07, .04), vec3f(.36, .46, .38), n.y * .5 + .5); }
fn fogged(c: vec3f, wp: vec3f) -> vec3f {
  let v = wp - g.cam.xyz; let d = length(v); let rd = v / d;
  let dens = g.mis.z;
  let hf = exp(-max(min(wp.y, g.cam.y), 0.) * .06);
  let T = exp(-d * dens * hf);
  let mu = max(dot(rd, g.sun.xyz), 0.);
  let ins = FOGC * (.5 + .8 * sat(rd.y * 1.2 + .1)) * (.85 + .3 * nzl(wp.xz * .015 + g.cam.w * .002).r) + SUNC * .22 * (pow(mu, 8.) * .9 + pow(mu, 2.) * .15);
  return c * T + ins * (1. - T);
}
fn cor(k: u32) -> vec2u { return vec2u(u32(k == 1u || k == 4u || k == 5u), u32(k == 2u || k == 3u || k == 5u)); }
fn fin(c: vec3f) -> vec4f { return vec4f(clamp(c, vec3f(0.), vec3f(50.)), 1.); }
`;
// ---------------------------------------------------------------- the sky behind everything
const HF_SKY = HF_G + /*wgsl*/`
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f { return vec4f(f32(i32(i & 1u) * 4 - 1), f32(i32(i >> 1u) * 4 - 1), 0., 1.); }
@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let uv = fc.xy * g.res.zw; let nd = vec2f(uv.x * 2. - 1., 1. - uv.y * 2.);
  let rd = normalize(g.fwd.xyz + g.right.xyz * nd.x * g.right.w + g.up.xyz * nd.y * g.up.w);
  let mu = max(dot(rd, g.sun.xyz), 0.);
  var c = mix(FOGC * 1.15, vec3f(.5, .64, .72) * 1.25, ss(.15, .9, rd.y));
  c += SUNC * (pow(mu, 6.) * .35 + pow(mu, 60.) * 1.2 + smoothstep(.9993, .9997, mu) * 12.);
  return fin(c);
}
`;
// ---------------------------------------------------------------- the floor: litter, moss, roots
const HF_GROUND = HF_G + /*wgsl*/`
const N = 256u; const SZ = 1400.;
fn gh(x: vec2f) -> f32 { return (nzl(x * .02).r - .5) * 3. + (nzl(x * .09 + 3.).g - .5) * .6; }
struct VO { @builtin(position) cp: vec4f, @location(0) wp: vec3f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VO {
  let q = vi / 6u; let c = vi % 6u;
  let o = cor(c);
  let ix = q % N + o.x; let iz = q / N + o.y;
  // denser near the centre (the camera stays near it)
  let f = (vec2f(f32(ix), f32(iz)) / f32(N)) * 2. - 1.;
  let w = sign(f) * pow(abs(f), vec2f(1.6)) * SZ * .5;
  let p = vec3f(w.x, gh(w), w.y);
  var o2: VO; o2.cp = g.vp * vec4f(p, 1.); o2.wp = p; return o2;
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let p = i.wp; let x = p.xz;
  let e = .05; let n0 = normalize(vec3f(gh(x - vec2f(e, 0.)) - gh(x + vec2f(e, 0.)), 2. * e, gh(x - vec2f(0., e)) - gh(x + vec2f(0., e))));
  // dead bamboo leaves: elongated, overlapping, in many directions; ochre, tan, brown; moss in the hollows
  var alb = vec3f(.16, .1, .055);
  var nb = vec3f(0.);
  for (var k = 0; k < 5; k++) {
    let a = f32(k) * 1.37 + .4; let r = mat2x2f(cos(a), sin(a), -sin(a), cos(a));
    let q = r * x * vec2f(5., 16.) * (1. + f32(k) * .45) + f32(k) * 7. + nz(x * .07).rg * 9.;
    let c = nz(q * .5);
    let lf = ss(.62, .78, c.r) * ss(.2, .45, c.g);
    let tone = mix(vec3f(.42, .3, .14), vec3f(.26, .16, .07), c.a);
    alb = mix(alb, tone * (.75 + .5 * nz(q * 3.).g), lf);
    nb += vec3f(c.r - .5, 0., c.g - .5) * lf * .5;
  }
  let moss = ss(.55, .75, nz(x * .35).g) * ss(.4, .7, nz(x * 1.7).r);
  alb = mix(alb, alb * vec3f(.8, .85, .7), moss * .5);
  let n = normalize(n0 + nb);
  let L = g.sun.xyz; let V = normalize(g.cam.xyz - p);
  let dist = length(p - g.cam.xyz);
  let sh = shadow4(p + n * .03);
  let ao = .55 + .45 * ss(.3, .7, nz(x * .25).b);
  var c = alb * (SUNC * sh * sat(dot(n, L)) + skyAmb(n) * .7 * ao * canopy(p.y));
  c += SUNC * sh * pow(sat(dot(n, normalize(L + V))), 24.) * .06;
  return fin(fogged(c, p));
}
`;
// ---------------------------------------------------------------- culms
const HF_CULM = HF_G + /*wgsl*/`
override SEG: u32 = 12u;
override RINGS: u32 = 120u;
struct CI { @location(0) a: vec4f, @location(1) b: vec4f };
struct VO { @builtin(position) cp: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) uv: vec2f, @location(3) @interpolate(flat) s: vec4f };
fn place(i: CI, v: f32, ang: f32, out_n: ptr<function, vec3f>) -> vec3f {
  let H = i.a.w; let y = v * H;
  let r = i.b.x * (1. - .45 * pow(v, 1.4)) * (1. + .35 * exp(-y * 9.)) * (1. - .97 * smoothstep(.93, 1., v));
  let lean = vec2f(i.b.y, i.b.z) * (y * y / H);
  let t = g.cam.w;
  let sw = vec2f(sin(t * .55 + i.b.w * 40.), cos(t * .43 + i.b.w * 31.)) * .12 * pow(v, 2.2);
  let c = vec3f(i.a.x + lean.x + sw.x, i.a.y + y, i.a.z + lean.y + sw.y);
  let rad = vec3f(cos(ang), 0., sin(ang));
  *out_n = rad;
  return c + rad * r;
}
@vertex fn vs(@builtin(vertex_index) vi: u32, i: CI) -> VO {
  let q = vi / 6u; let k = vi % 6u;
  let o = cor(k);
  let s = q % SEG + o.x; let r = q / SEG + o.y;
  let ang = f32(s) / f32(SEG) * 2. * PI; let v = f32(r) / f32(RINGS);
  var n: vec3f;
  let p = place(i, v, ang, &n);
  var o2: VO; o2.cp = g.vp * vec4f(p, 1.); o2.wp = p; o2.n = n; o2.uv = vec2f(ang, v * i.a.w); o2.s = vec4f(i.b.w, i.b.x, i.a.w, 0.);
  return o2;
}
@vertex fn vsSh(@builtin(vertex_index) vi: u32, i: CI) -> @builtin(position) vec4f {
  let q = vi / 6u; let k = vi % 6u;
  let o = cor(k);
  let s = q % SEG + o.x; let r = q / SEG + o.y;
  var n: vec3f;
  let p = place(i, f32(r) / f32(RINGS), f32(s) / f32(SEG) * 2. * PI, &n);
  return g.sm * vec4f(p, 1.);
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let sd = i.s.x; let y = i.uv.y; let a = i.uv.x;
  let sp = .3 + .12 * hs(sd * 7.) + y * .012;               // internodes lengthen up the culm
  let f = fract(y / sp); let nd = min(f, 1. - f) * sp;      // metres to the nearest node
  // colour: fresh green to yellow-olive by age, vertical streaks, darker sheath scars low down
  let age = hs(sd * 3.1);
  var alb = mix(vec3f(.09, .2, .035), vec3f(.2, .24, .06), age);
  alb = mix(alb, vec3f(.26, .25, .1), ss(.7, 1., age) * .6);
  let st = nz(vec2f(a * 2.5 + sd * 50., y * .35)).r;
  alb *= .78 + .45 * st;
  // below each node a powdery white bloom fading down; the node: a thin raised ridge, a dark groove above it
  let below = (1. - f) * sp;
  let wax = ss(.0, .015, below) * ss(.16, .02, below) * (.6 + .4 * nz(vec2f(a * 9., y * 6.)).g);
  alb = mix(alb, vec3f(.48, .52, .46), wax * .6);
  let ridge = ss(.008, .0, abs(f * sp - .004));
  let groove = ss(.01, .0, abs(f * sp - .016));
  alb = (alb + vec3f(.012, .012, .006) * ridge) * (1. - groove * .45);
  let low = ss(4., .5, y);
  alb = mix(alb, vec3f(.2, .14, .07), low * ss(.5, .8, nz(vec2f(a * 3., y * 2.)).g) * .6);
  let lich = ss(.72, .8, nz(vec2f(a * 4. + sd * 9., y * 1.3)).g) * ss(6., 1., y);
  alb = mix(alb, vec3f(.45, .47, .38), lich * .5);
  var n = normalize(i.n + vec3f(0., (ridge - groove) * .3 + wax * 0., 0.) + vec3f(nz(vec2f(a * 40., y * 3.)).r - .5, 0., 0.) * .15);
  let L = g.sun.xyz; let V = normalize(g.cam.xyz - i.wp);
  let sh = shadow4(i.wp + n * .02);
  let ao = canopy(i.wp.y) * (.75 + .25 * n.y);
  var c = alb * (SUNC * sh * sat(dot(n, L)) + skyAmb(n) * ao);
  let H = normalize(L + V);
  c += SUNC * sh * (pow(sat(dot(n, H)), 60.) * .35 + pow(sat(dot(n, H)), 12.) * .05);
  c += skyAmb(reflect(-V, n)) * pow(1. - sat(dot(n, V)), 4.) * .5 * ao;
  c += SUNC * sh * pow(1. - sat(dot(n, V)), 3.) * sat(dot(V, -L) * .5 + .5) * .12 * alb * 4.;
  return fin(fogged(c, i.wp));
}
`;
// ---------------------------------------------------------------- leaves
const HF_LEAF = HF_G + /*wgsl*/`
override ROWS: f32 = 5.;
struct LI { @location(0) a: vec4f, @location(1) b: vec4f };
struct LO { @builtin(position) cp: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) uv: vec2f, @location(3) @interpolate(flat) s: vec2f };
fn leafP(vi: u32, i: LI, nOut: ptr<function, vec3f>, uvOut: ptr<function, vec2f>) -> vec3f {
