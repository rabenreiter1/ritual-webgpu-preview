// noise bake, brush (cloud holes, mirror wipe), bloom chain, final pass

// 256² tileable noise, 16 cells across: r, g gradient noise; b cellular distance; a white noise
const W_NOISE = /*wgsl*/`
@group(0) @binding(0) var o: texture_storage_2d<rgba8unorm, write>;
fn pcg(v: u32) -> u32 { let s = v * 747796405u + 2891336453u; let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
fn hh(c: vec2i, s: u32) -> f32 { let w = (c % vec2i(16) + vec2i(16)) % vec2i(16); return f32(pcg(u32(w.x) + pcg(u32(w.y) + s * 7919u))) / 4294967295.; }
fn gn(p: vec2f, s: u32) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p); let u = f * f * f * (f * (f * 6. - 15.) + 10.);
  var v = array<f32, 4>();
  for (var k = 0; k < 4; k++) {
    let o = vec2i(k & 1, k >> 1); let a = hh(i + o, s) * 6.2831853;
    v[k] = dot(vec2f(cos(a), sin(a)), f - vec2f(o));
  }
  return mix(mix(v[0], v[1], u.x), mix(v[2], v[3], u.x), u.y);
}
fn wor(p: vec2f) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p); var d = 9.;
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let o = vec2i(x, y); let c = vec2f(hh(i + o, 3u), hh(i + o, 5u));
    d = min(d, length(vec2f(o) + c - f));
  } }
  return d;
}
@compute @workgroup_size(8, 8) fn main(@builtin(global_invocation_id) g: vec3u) {
  let p = (vec2f(g.xy) + .5) / 16.;
  let w = vec4f(gn(p, 1u) * .75 + .5, gn(p, 2u) * .75 + .5, saturate(wor(p) / 1.1), hh(vec2i(g.xy), 9u));
  textureStore(o, g.xy, saturate(w));
}
`;
// one stroke of the brush into the mask: a capsule from a to b, soft edge, blended with max
const W_BRUSH = /*wgsl*/`
struct B { ab: vec4f, rs: vec4f }
@group(0) @binding(0) var<uniform> b: B;
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let s = vec2f(b.rs.z, 1.);
  let pa = (i.uv - b.ab.xy) * s; let ba = (b.ab.zw - b.ab.xy) * s;
  let h = saturate(dot(pa, ba) / max(dot(ba, ba), 1e-8));
  let d = length(pa - ba * h);
  let v = smoothstep(b.rs.x, b.rs.x * .35, d) * b.rs.y;
  return vec4f(v, v, v, v);
}
`;
const W_BLIT = /*wgsl*/`
@group(0) @binding(0) var t: texture_2d<f32>;
@group(0) @binding(1) var s: sampler;
@group(0) @binding(2) var<uniform> sc: vec4f;      // x, y: share of the source that holds the image
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(t, s, uv * sc.xy, 0.).rgb; }
// first step down: a weighted 4-tap that keeps single bright pixels from flickering
@fragment fn fsDown0(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t)) / sc.xy;
  var c = vec3f(0.); var w = 0.;
  for (var k = 0; k < 4; k++) {
    let o = vec2f(f32(k & 1) - .5, f32(k >> 1) - .5) * px * 2.;
    let v = min(tap(i.uv + o), vec3f(60.)); let ww = 1. / (1. + dot(v, vec3f(.2126, .7152, .0722)));
    c += v * ww; w += ww;
  }
  return vec4f(c / w, 1.);
}
@fragment fn fsCopy(i: VO) -> @location(0) vec4f { return vec4f(tap(i.uv), 1.); }
@fragment fn fsDown(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t));
  var c = vec3f(0.);
  for (var k = 0; k < 4; k++) { c += tap(i.uv + vec2f(f32(k & 1) - .5, f32(k >> 1) - .5) * px * 2.); }
  return vec4f(c * .25, 1.);
}
@fragment fn fsUp(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t));
  var c = vec3f(0.);
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let w = (2. - abs(f32(x))) * (2. - abs(f32(y)));
    c += tap(i.uv + vec2f(f32(x), f32(y)) * px) * w;
  } }
  return vec4f(c / 16., 1.);
}
`;
const W_POST = /*wgsl*/`
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var tS: texture_2d<f32>;
@group(0) @binding(2) var tB: texture_2d<f32>;
@group(0) @binding(3) var tL: texture_2d<f32>;
@group(0) @binding(4) var sc: sampler;
struct U { res: vec4f, tm: vec4f, cp: vec4f, ct: vec4f, pt: vec4f, a: vec4f, b: vec4f, c: vec4f, d: vec4f,
  c0: vec4f, c1: vec4f, c2: vec4f, c3: vec4f, fx: vec4f, fx2: vec4f, sun: vec4f }
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
fn aces(x: vec3f) -> vec3f { return saturate(x * (2.51 * x + .03) / (x * (2.43 * x + .59) + .14)); }
fn srgb(c: vec3f) -> vec3f { return select(1.055 * pow(c, vec3f(1. / 2.4)) - .055, c * 12.92, c < vec3f(.0031308)); }
fn hsh(p: vec2f) -> f32 { var q = fract(p * vec2f(.1031, .1030)); q += dot(q, q.yx + 33.33); return fract((q.x + q.y) * q.x); }
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let dim = vec2f(textureDimensions(tS));
  let s = u.res.xy / dim;
  let uv = i.uv;
  // upscale with a light sharpen (the scene renders at a dynamic resolution)
  let px = 1. / dim;
  let c0 = textureSampleLevel(tS, sc, uv * s, 0.).rgb;
  let nb = textureSampleLevel(tS, sc, uv * s + vec2f(px.x, 0.), 0.).rgb + textureSampleLevel(tS, sc, uv * s - vec2f(px.x, 0.), 0.).rgb
         + textureSampleLevel(tS, sc, uv * s + vec2f(0., px.y), 0.).rgb + textureSampleLevel(tS, sc, uv * s - vec2f(0., px.y), 0.).rgb;
  var c = max(c0 + (c0 - nb * .25) * .3, vec3f(0.));
  let low = textureSampleLevel(tL, sc, uv, 0.).rgb;
  c = mix(c, low, saturate(u.fx.w));
  c += textureSampleLevel(tB, sc, uv, 0.).rgb * u.fx2.w;
  // steam over the whole frame (before the pull-back reveals the mirror)
  if (u.fx2.x > .001) {
    let asp = u.res.x / u.res.y;
    let q = vec2f(uv.x * asp, uv.y) * 28.; let id = floor(q);
    let o = vec2f(hsh(id), hsh(id + 7.1));
    let dd = length(fract(q) - .5 - (o - .5) * .5); let rr = .12 + .22 * o.y;
    let drop = smoothstep(rr, rr - .08, dd) * step(.6, o.x) * saturate(u.fx2.x * 2. - .6) * .6;
    let edge = length((uv - .5) * vec2f(asp, 1.));
    let f = saturate(u.fx2.x * 1.7 - (.9 - edge) * .9);
    let fogc = mix(low, vec3f(lum3(low)), .5) * .55 + vec3f(.45);
    c = mix(c, fogc, f * (1. - drop * .7)) + vec3f(.25) * drop * f * smoothstep(rr * .45, 0., dd + rr * .3);
  }
  c *= u.fx.x;
  c = aces(c);
  let v = (uv - .5) * vec2f(u.res.x / u.res.y, 1.);
  c *= 1. - u.fx2.y * smoothstep(.35, 1.2, length(v));
  c = mix(c, vec3f(1.), saturate(u.fx.y));
  c = mix(c, vec3f(0.), saturate(u.fx.z));
  c = srgb(c);
  let n = hsh(i.pos.xy + fract(u.tm.x * 7.13) * 91.7) - .5;
  c += n * (1. / 255. + u.fx2.z * .035);
  return vec4f(c, 1.);
}
fn lum3(c: vec3f) -> f32 { return dot(c, vec3f(.2126, .7152, .0722)); }
`;

// ============================================================================
// hero 2 · the cloud sea at sunrise (kilometres, Y up): a volumetric layer of stratocumulus from a baked 3D
// noise (Perlin-Worley shapes, Worley erosion), lit by a low sun (dual-lobe phase, powder, multiple-scattering
// octaves), with the visitor's holes (mask texture) opening onto the bamboo valley below; a reprojected
// history smooths the dithered march.
// ============================================================================
const HC_N3D = /*wgsl*/`
@group(0) @binding(0) var o: texture_storage_3d<rgba8unorm, write>;
fn h3(p: vec3i, per: i32, s: u32) -> vec3f {
  let q = ((p % vec3i(per)) + vec3i(per)) % vec3i(per);
  var v = vec3u(q) * vec3u(1597334673u, 3812015801u, 2798796415u) + vec3u(s * 747796405u);
  v = (v.x ^ v.y ^ v.z) * vec3u(1597334673u, 3812015801u, 2798796415u);
  return vec3f(v % vec3u(65536u)) / 65536.;
}
fn wor(p: vec3f, per: i32, s: u32) -> f32 {
  let i = vec3i(floor(p)); let f = fract(p); var d = 9.;
  for (var z = -1; z <= 1; z++) { for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let o2 = vec3i(x, y, z); let r = vec3f(o2) + h3(i + o2, per, s) - f; d = min(d, dot(r, r));
  } } }
  return 1. - saturate(sqrt(d));
}
fn grad(p: vec3f, per: i32, s: u32) -> f32 {
  let i = vec3i(floor(p)); let f = fract(p); let u = f * f * f * (f * (f * 6. - 15.) + 10.);
  var v = array<f32, 8>();
  for (var k = 0; k < 8; k++) {
    let o2 = vec3i(k & 1, (k >> 1) & 1, k >> 2);
    let gg = h3(i + o2, per, s) * 2. - 1.;
    v[k] = dot(normalize(gg + 1e-4), f - vec3f(o2));
  }
  return mix(mix(mix(v[0], v[1], u.x), mix(v[2], v[3], u.x), u.y), mix(mix(v[4], v[5], u.x), mix(v[6], v[7], u.x), u.y), u.z) * .5 + .5;
}
@compute @workgroup_size(4, 4, 4) fn main(@builtin(global_invocation_id) id: vec3u) {
  let p = vec3f(id) / 128.;
  var pf = 0.; var a = .5; var f = 4.;
  for (var k = 0; k < 4; k++) { pf += a * grad(p * f, i32(f), 1u + u32(k)); f *= 2.; a *= .5; }
  let w1 = wor(p * 4., 4, 7u) * .625 + wor(p * 8., 8, 9u) * .25 + wor(p * 16., 16, 11u) * .125;
  let pw = saturate(pf * 1.15 - (1. - w1) * .55 + .15);
  let w2 = wor(p * 8., 8, 13u) * .625 + wor(p * 16., 16, 15u) * .25 + wor(p * 32., 32, 17u) * .125;
  let w3 = wor(p * 16., 16, 19u) * .625 + wor(p * 32., 32, 21u) * .25 + wor(p * 64., 64, 23u) * .125;
  textureStore(o, id, vec4f(pw, w1, w2, w3));
}
`;
const HC_CLOUD = /*wgsl*/`
struct G { vp: mat4x4f, pvp: mat4x4f, cam: vec4f, right: vec4f, up: vec4f, fwd: vec4f, sun: vec4f, res: vec4f, mis: vec4f, ex: vec4f };
@group(0) @binding(0) var<uniform> g: G;
@group(0) @binding(1) var sR: sampler;
@group(0) @binding(2) var t3: texture_3d<f32>;
@group(0) @binding(3) var tN: texture_2d<f32>;
@group(0) @binding(4) var tM: texture_2d<f32>;
@group(0) @binding(5) var tH: texture_2d<f32>;
@group(0) @binding(6) var sC: sampler;
const PI = 3.14159265;
const BOT = .05; const TOP = .62; const GND = -.42;
fn ss(a: f32, b: f32, x: f32) -> f32 { let t = clamp((x - a) / (b - a), 0., 1.); return t * t * (3. - 2. * t); }
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(.06711056, .00583715)))); }
fn n2(p: vec2f) -> vec4f { return textureSampleLevel(tN, sR, p * .0625, 0.); }
fn hole(x: vec2f) -> f32 {
  let q = (x - g.ex.xy) / g.ex.z + .5;
  if (any(q < vec2f(0.)) || any(q > vec2f(1.))) { return 0.; }
  return textureSampleLevel(tM, sC, q, 0.).r;
}
fn remap(x: f32, a: f32, b: f32, c: f32, d: f32) -> f32 { return c + (x - a) / (b - a) * (d - c); }
fn dens(p: vec3f, cheap: bool) -> f32 {
  let h = (p.y - BOT) / (TOP - BOT);
  if (h < 0. || h > 1.) { return 0.; }
  let wind = vec3f(g.cam.w * .004, 0., g.cam.w * .0015);
  let wx = p.xz + wind.xz;
  // coverage: a closed sea with gentle swells; the visitor's holes; wider gaps far away
  var cov = .82 + .18 * (n2(wx * .55).r - .5) * 2. - hole(p.xz) * 1.25;
  cov -= ss(.55, .75, n2(wx * .18 + 3.).g) * .35;
  if (cov <= .02) { return 0.; }
  // stratocumulus profile: soft base, rounded tops
  let prof = ss(0., .12, h) * ss(1., .45, h);
  let base = textureSampleLevel(t3, sR, (p + wind) * vec3f(1.25, 1.9, 1.25), 0.);
  let shape = remap(base.r, (base.g * .625 + base.b * .25 + base.a * .125) - 1., 1., 0., 1.);
  var d = saturate(remap(shape * prof, 1. - cov, 1., 0., 1.));

  let det = textureSampleLevel(t3, sR, (p + wind * 2.) * 4.3, 0.);
  let df = det.g * .625 + det.b * .25 + det.a * .125;
  let er = mix(df, 1. - df, saturate(h * 6.));

}
fn hg(c: f32, k: f32) -> f32 { let k2 = k * k; return (1. - k2) / (4. * PI * pow(1. + k2 - 2. * k * c, 1.5)); }
const SUNC = vec3f(1.65, 1.08, .66);
fn skyC(rd: vec3f) -> vec3f {
  let sd = g.sun.xyz; let e = max(rd.y, 0.);
  var c = mix(vec3f(1.3, .52, .2), vec3f(1.05, .7, .45), ss(0., .06, e));
  c = mix(c, vec3f(.34, .48, .8), ss(.03, .28, e));
  c = mix(c, vec3f(.12, .22, .5), ss(.22, .8, e));
  let s = max(dot(rd, sd), 0.);
  c += vec3f(1.4, .8, .38) * (pow(s, 9.) * .8 + pow(s, 2.5) * .15);
  c += vec3f(70., 46., 26.) * ss(.99955, .99975, s);
  return c;
}
fn ridges(rd: vec3f, c0: vec3f) -> vec3f {
  var c = c0; let az = atan2(rd.x, -rd.z);
  for (var i = 0; i < 3; i++) {
    let fi = f32(i);
    let fq = 2.2 + fi * 2.;
    let x0 = az * fq + fi * 11.3; let e = .01;
    let h1 = n2(vec2f(x0, fi * 5.7)).r * .7 + n2(vec2f(x0 * 3.1, fi * 9.1 + 2.)).g * .22 + n2(vec2f(x0 * 9.3, fi * 3.3)).r * .08;
    let h2 = n2(vec2f(x0 + e, fi * 5.7)).r * .7 + n2(vec2f((x0 + e) * 3.1, fi * 9.1 + 2.)).g * .22 + n2(vec2f((x0 + e) * 9.3, fi * 3.3)).r * .08;
    let hh = .002 + (.007 + fi * .006) * pow(h1, 1.6) * 1.6 - fi * .0015;
    let m = ss(hh + .0006, hh - .0006, rd.y);
    // which side faces the sun: the slope along the ridge against the sun's azimuth
    let slope = (h2 - h1) / e * sign(sin(az - atan2(g.sun.x, -g.sun.z)));
    let lit = saturate(.5 + slope * .9);
    let sg = pow(max(dot(normalize(vec3f(rd.x, 0., rd.z)), normalize(vec3f(g.sun.x, 0., g.sun.z))), 0.), 4.);
    var tone = mix(vec3f(.42, .38, .48), vec3f(.13, .14, .24), fi / 2.) * mix(.75, 1.25, lit);
    tone += vec3f(.65, .36, .16) * sg * lit * (.5 - fi * .12);
    // aerial perspective: far ranges paler, every range sinks into the bright haze above the cloud sea
    let foot = ss(.0, hh * .9 + .001, rd.y);
    tone = mix(skyC(vec3f(rd.x, .01, rd.z)), tone, (.68 + fi * .14) * foot);
    c = mix(c, tone, m);
  }
  return c;
}
fn rpath(z: f32) -> f32 { let c = g.ex.xy; return c.x + .16 * sin((z - c.y) * 2.1 + .6) + .05 * sin((z - c.y) * 5.3); }
// terrain (km): rolling hills that fall towards the river
fn th(x: vec2f) -> f32 {
  let dr = abs(x.x - rpath(x.y));
  let hills = (n2(x * .9).r - .5) * .3 + (n2(x * 2.7 + 3.).g - .5) * .1 + (n2(x * 8. + 7.).r - .5) * .025;
  let crown = saturate(crowns(x) / 1.75) * .014 * ss(.004, .02, dr);
  return GND + .06 + hills * ss(0., .25, dr) + .05 * ss(.03, .5, dr) - .055 * ss(.12, 0., dr) + crown;
}
fn crowns(x: vec2f) -> f32 { return (1. - n2(x * 70.).b) * 1.2 + .5 * (1. - n2(x * 260. + 5.).b) + .25 * (1. - n2(x * 600. + 9.).b); }
fn valley(p: vec3f, rd: vec3f, tg: f32) -> vec3f {
  let x = p.xz; let e = .004;
  let e2 = .0015; let h0 = th(x); let n0 = normalize(vec3f(h0 - th(x + vec2f(e2, 0.)), e2, h0 - th(x + vec2f(0., e2))));
  let ec = .0012;
  let c0 = crowns(x); let cx = crowns(x + vec2f(ec, 0.)); let cz = crowns(x + vec2f(0., ec));
  let n = normalize(n0 + vec3f(-(cx - c0), 0., -(cz - c0)) / ec * .003);
  let pr = rpath(x.y) + (n2(vec2f(x.y * 14., 2.)).r - .5) * .01; let wid = .02 + .02 * ss(.3, .8, n2(vec2f(x.y * 1.3, 4.)).r) + (n2(vec2f(x.y * 30., 5.)).g - .5) * .008;
  let dr = abs(x.x - pr) - wid;
  // bamboo seen from above: feathery light-green crowns, darker gaps, some yellowing groves
  let cr = saturate(c0 / 1.95);
  let tone = n2(floor(x * 70. * 16.) / 16. * .0625 * 16.).a;
  var al = mix(vec3f(.006, .016, .005), vec3f(.075, .15, .035), cr * cr) * (.75 + .5 * n2(x * 23.).r);
  al = mix(al, vec3f(.13, .17, .05), ss(.55, .8, n2(x * 3.).r) * .45 * cr);
  al = mix(al, al * vec3f(.7, .85, .7), ss(.4, .7, n2(x * .8 + 2.).g) * .5);
  // groves of other greens, clearings with grass, a few bare rock spots on the slopes
  al = mix(al, vec3f(.05, .09, .045) * (.6 + .6 * cr), ss(.62, .72, n2(x * 1.6 + 9.).r) * .7);
  let clear = ss(.78, .84, n2(x * 3.5 + 13.).g);
  al = mix(al, vec3f(.08, .11, .04) * (.8 + .3 * n2(x * 40.).r), clear * .6);
  let slope = 1. - n0.y;
  al = mix(al, vec3f(.2, .19, .17), ss(.12, .2, slope) * .5);
  let L = g.sun.xyz;
  // under the cloud sea: soft sky light from above, the low sun only through the holes
  var sh = 0.;
  for (var k = 0; k < 4; k++) { let pp = p + L / max(L.y, .05) * (BOT - p.y + (f32(k) + .5) / 4. * (TOP - BOT)); sh += dens(pp, true); }
  let tr = exp(-sh * (TOP - BOT) / 4. * .9);
  var ts = 1.; var q = p + vec3f(0., .004, 0.);
  for (var k = 1; k <= 8; k++) { let pp = q + L * f32(k) * .04; ts = min(ts, saturate((pp.y - th(pp.xz)) * 60.)); }
  let sky = (.2 + .8 * n0.y * n0.y) * (.6 + .4 * ss(-.05, .08, p.y - GND - .06));
  var c = al * (vec3f(.55, .62, .72) * sky * 1.05 + vec3f(1.7, 1.1, .65) * tr * ts * saturate(dot(n, L) * 1.6 + .1) * 1.6);
  c *= .3 + .7 * ss(.1, .9, c0);
  // banks, the river: sky and sun in the water, a little current
