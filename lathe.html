// 256² tileable noise, 16 cells across: r, g gradient noise; b cellular distance; a white noise
const W_NOISE = /*wgsl*/`
@group(0) @binding(0) var o: texture_storage_2d<rgba8unorm, write>;
fn pcg(v: u32) -> u32 { let s = v * 747796405u + 2891336453u; let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
fn hh(c: vec2i, s: u32) -> f32 { let w = (c % vec2i(16) + vec2i(16)) % vec2i(16); return f32(pcg(u32(w.x) + pcg(u32(w.y) + s * 7919u))) / 4294967295.; }
fn gn(p: vec2f, s: u32) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p); let u = f * f * f * (f * (f * 6. - 15.) + 10.);
  var v = array<f32, 4>();
  for (var k = 0; k < 4; k++) {
    let o = vec2i(k & 1, k >> 1); let a = hh(i + o, s) * 6.2831853;
    v[k] = dot(vec2f(cos(a), sin(a)), f - vec2f(o));
  }
  return mix(mix(v[0], v[1], u.x), mix(v[2], v[3], u.x), u.y);
}
fn wor(p: vec2f) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p); var d = 9.;
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let o = vec2i(x, y); let c = vec2f(hh(i + o, 3u), hh(i + o, 5u));
    d = min(d, length(vec2f(o) + c - f));
  } }
  return d;
}
@compute @workgroup_size(8, 8) fn main(@builtin(global_invocation_id) g: vec3u) {
  let p = (vec2f(g.xy) + .5) / 16.;
  let w = vec4f(gn(p, 1u) * .75 + .5, gn(p, 2u) * .75 + .5, saturate(wor(p) / 1.1), hh(vec2i(g.xy), 9u));
  textureStore(o, g.xy, saturate(w));
}
`;
// one stroke of the brush into the mask: a capsule from a to b, soft edge, blended with max
const W_BRUSH = /*wgsl*/`
struct B { ab: vec4f, rs: vec4f }
@group(0) @binding(0) var<uniform> b: B;
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let s = vec2f(b.rs.z, 1.);
  let pa = (i.uv - b.ab.xy) * s; let ba = (b.ab.zw - b.ab.xy) * s;
  let h = saturate(dot(pa, ba) / max(dot(ba, ba), 1e-8));
  let d = length(pa - ba * h);
  let v = smoothstep(b.rs.x, b.rs.x * .35, d) * b.rs.y;
  return vec4f(v, v, v, v);
}
`;
const W_BLIT = /*wgsl*/`
@group(0) @binding(0) var t: texture_2d<f32>;
@group(0) @binding(1) var s: sampler;
@group(0) @binding(2) var<uniform> sc: vec4f;      // x, y: share of the source that holds the image
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(t, s, uv * sc.xy, 0.).rgb; }
// first step down: a weighted 4-tap that keeps single bright pixels from flickering
@fragment fn fsDown0(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t)) / sc.xy;
  var c = vec3f(0.); var w = 0.;
  for (var k = 0; k < 4; k++) {
    let o = vec2f(f32(k & 1) - .5, f32(k >> 1) - .5) * px * 2.;
    let v = min(tap(i.uv + o), vec3f(60.)); let ww = 1. / (1. + dot(v, vec3f(.2126, .7152, .0722)));
    c += v * ww; w += ww;
  }
  return vec4f(c / w, 1.);
}
@fragment fn fsCopy(i: VO) -> @location(0) vec4f { return vec4f(tap(i.uv), 1.); }
@fragment fn fsDown(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t));
  var c = vec3f(0.);
  for (var k = 0; k < 4; k++) { c += tap(i.uv + vec2f(f32(k & 1) - .5, f32(k >> 1) - .5) * px * 2.); }
  return vec4f(c * .25, 1.);
}
@fragment fn fsUp(i: VO) -> @location(0) vec4f {
  let px = 1. / vec2f(textureDimensions(t));
  var c = vec3f(0.);
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let w = (2. - abs(f32(x))) * (2. - abs(f32(y)));
    c += tap(i.uv + vec2f(f32(x), f32(y)) * px) * w;
  } }
  return vec4f(c / 16., 1.);
}
`;
const W_POST = /*wgsl*/`
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var tS: texture_2d<f32>;
@group(0) @binding(2) var tB: texture_2d<f32>;
@group(0) @binding(3) var tL: texture_2d<f32>;
@group(0) @binding(4) var sc: sampler;
struct U { res: vec4f, tm: vec4f, cp: vec4f, ct: vec4f, pt: vec4f, a: vec4f, b: vec4f, c: vec4f, d: vec4f,
  c0: vec4f, c1: vec4f, c2: vec4f, c3: vec4f, fx: vec4f, fx2: vec4f, sun: vec4f }
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p * 2. - 1., 0., 1.); o.uv = vec2f(p.x, 1. - p.y); return o;
}
fn aces(x: vec3f) -> vec3f { return saturate(x * (2.51 * x + .03) / (x * (2.43 * x + .59) + .14)); }
fn srgb(c: vec3f) -> vec3f { return select(1.055 * pow(c, vec3f(1. / 2.4)) - .055, c * 12.92, c < vec3f(.0031308)); }
fn hsh(p: vec2f) -> f32 { var q = fract(p * vec2f(.1031, .1030)); q += dot(q, q.yx + 33.33); return fract((q.x + q.y) * q.x); }
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let dim = vec2f(textureDimensions(tS));
  let s = u.res.xy / dim;
  let uv = i.uv;
  // upscale with a light sharpen (the scene renders at a dynamic resolution)
  let px = 1. / dim;
  let c0 = textureSampleLevel(tS, sc, uv * s, 0.).rgb;
  let nb = textureSampleLevel(tS, sc, uv * s + vec2f(px.x, 0.), 0.).rgb + textureSampleLevel(tS, sc, uv * s - vec2f(px.x, 0.), 0.).rgb
         + textureSampleLevel(tS, sc, uv * s + vec2f(0., px.y), 0.).rgb + textureSampleLevel(tS, sc, uv * s - vec2f(0., px.y), 0.).rgb;
  var c = max(c0 + (c0 - nb * .25) * .3, vec3f(0.));
  let low = textureSampleLevel(tL, sc, uv, 0.).rgb;
  c = mix(c, low, saturate(u.fx.w));
  c += textureSampleLevel(tB, sc, uv, 0.).rgb * u.fx2.w;
  // steam over the whole frame (before the pull-back reveals the mirror)
  if (u.fx2.x > .001) {
    let asp = u.res.x / u.res.y;
    let q = vec2f(uv.x * asp, uv.y) * 28.; let id = floor(q);
    let o = vec2f(hsh(id), hsh(id + 7.1));
    let dd = length(fract(q) - .5 - (o - .5) * .5); let rr = .12 + .22 * o.y;
    let drop = smoothstep(rr, rr - .08, dd) * step(.6, o.x) * saturate(u.fx2.x * 2. - .6) * .6;
    let edge = length((uv - .5) * vec2f(asp, 1.));
    let f = saturate(u.fx2.x * 1.7 - (.9 - edge) * .9);
    let fogc = mix(low, vec3f(lum3(low)), .5) * .55 + vec3f(.45);
    c = mix(c, fogc, f * (1. - drop * .7)) + vec3f(.25) * drop * f * smoothstep(rr * .45, 0., dd + rr * .3);
  }
  c *= u.fx.x;
  c = aces(c);
  let v = (uv - .5) * vec2f(u.res.x / u.res.y, 1.);
  c *= 1. - u.fx2.y * smoothstep(.35, 1.2, length(v));
  c = mix(c, vec3f(1.), saturate(u.fx.y));
  c = mix(c, vec3f(0.), saturate(u.fx.z));
  c = srgb(c);
  let n = hsh(i.pos.xy + fract(u.tm.x * 7.13) * 91.7) - .5;
  c += n * (1. / 255. + u.fx2.z * .035);
  return vec4f(c, 1.);
}
fn lum3(c: vec3f) -> f32 { return dot(c, vec3f(.2126, .7152, .0722)); }
`;

// ============================================================================
// hero 3 · the bottle on the lathe (centimetres, the lathe axis along X): the culm piece spins between chuck
// and tailstock; the cutter turns it to the CAD profile (TUBE_PROFILE), chips fly; the laser engraves, sparks
// and smoke. Studio light (key softbox, rim strip), shadow map, depth of field in the grade.
//   g.ex: x spin, y mill x (cm, 0 → 17), z laser x, w laser on     g.mis: exposure, mill on, seed, focus
// ============================================================================
const HL_G = /*wgsl*/`
struct G { vp: mat4x4f, sm: mat4x4f, cam: vec4f, right: vec4f, up: vec4f, fwd: vec4f, sun: vec4f, res: vec4f, mis: vec4f, ex: vec4f };
@group(0) @binding(0) var<uniform> g: G;
@group(0) @binding(1) var sR: sampler;
@group(0) @binding(2) var sS: sampler_comparison;
@group(0) @binding(3) var tSh: texture_depth_2d;
@group(0) @binding(4) var tN: texture_2d<f32>;
@group(0) @binding(5) var<uniform> S: array<vec4f, 128>;
const PI = 3.14159265;
fn sat(x: f32) -> f32 { return clamp(x, 0., 1.); }
fn ss(a: f32, b: f32, x: f32) -> f32 { let t = clamp((x - a) / (b - a), 0., 1.); return t * t * (3. - 2. * t); }
fn hs(x: f32) -> f32 { return fract(sin(x * 127.1) * 43758.5453); }
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(.06711056, .00583715)))); }
fn nz(p: vec2f) -> vec4f { return textureSampleLevel(tN, sR, p * .0625, 0.); }
fn tubeR(x: f32) -> f32 { let f = clamp(x / 17., 0., 1.) * 511.; let i = u32(f); let j = min(i + 1u, 511u); return mix(S[i >> 2u][i & 3u], S[j >> 2u][j & 3u], fract(f)); }
fn culmR(x: f32) -> f32 { return 3.6 + .13 * exp(-(x - .3) * (x - .3) * 4.) + .11 * exp(-(x - 13.8) * (x - 13.8) * 9.) + .03 * sin(x * .4); }
fn pieceR(x: f32) -> f32 { return mix(culmR(x), tubeR(x), ss(g.ex.y + .025, g.ex.y - .025, x)); }
fn shadow(p: vec3f) -> f32 {
  let s = g.sm * vec4f(p, 1.); let u = vec3f(s.x * .5 + .5, .5 - s.y * .5, s.z - .0015); let e = 1.2 / 2048.;
  var a = 0.;
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) { a += textureSampleCompareLevel(tSh, sS, u.xy + vec2f(f32(x), f32(y)) * e, u.z); } }
  return a / 9.;
}
// the studio: a warm grey sweep, a big key softbox upper left, a rim strip behind right, a low fill card
const KEY = vec3f(-.55, .62, .56);
fn sbox(rd: vec3f, k: vec3f, w: vec2f, soft: f32) -> f32 {
  let kk = normalize(k); let t = normalize(cross(kk, vec3f(0., 1., 0.))); let b = cross(t, kk);
  let z = dot(rd, kk); if (z <= .05) { return 0.; }
  let q = abs(vec2f(dot(rd, t), dot(rd, b)) / z) - w;
  return 1. - smoothstep(-soft, soft * .5, max(q.x, q.y));
}
fn env(rd: vec3f) -> vec3f {
  var c = mix(vec3f(.05, .045, .04), vec3f(.32, .3, .27), ss(-.6, .8, rd.y));
  c += vec3f(7.5, 7.2, 6.6) * sbox(rd, KEY, vec2f(.5, .36), .08);
  c += vec3f(3.2, 3.4, 3.8) * sbox(rd, vec3f(.75, .25, -.6), vec2f(.05, .7), .03);
  c += vec3f(.9, .85, .8) * sbox(rd, vec3f(.1, -.35, 1.), vec2f(.7, .2), .2);
  return c;
}
fn h21(p: vec2f) -> f32 { var q = fract(p * vec2f(.1031, .1030)); q += dot(q, q.yx + 33.33); return fract((q.x + q.y) * q.x); }
fn vn(p: vec2f) -> f32 { let i = floor(p); let f = fract(p); let u = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2f(1., 0.)), u.x), mix(h21(i + vec2f(0., 1.)), h21(i + vec2f(1., 1.)), u.x), u.y); }
// bamboo fibre along the axis: s around (cm), x along (cm)
var<private> FW: f32;   // the pixel footprint in cm: finer detail fades out instead of aliasing
fn fibre(s: f32, x: f32) -> f32 { return mix(.5, vn(vec2f(s * 55., x * 1.6)), ss(.03, .008, FW)) * .5 + mix(.5, vn(vec2f(s * 140., x * 4.)), ss(.012, .003, FW)) * .3 + vn(vec2f(s * 9., x * .3)) * .2; }
fn fin(c: vec3f) -> vec4f { return vec4f(clamp(c, vec3f(0.), vec3f(60.)), 1.); }
fn fres(f0: f32, c: f32) -> f32 { let x = 1. - sat(c); let x2 = x * x; return f0 + (1. - f0) * x2 * x2 * x; }
fn ggx(n: vec3f, v: vec3f, l: vec3f, r: f32) -> f32 { let h = normalize(v + l); let nh = sat(dot(n, h)); let a = max(r * r, .002); let a2 = a * a; let d = nh * nh * (a2 - 1.) + 1.; return a2 / (PI * d * d) * sat(dot(n, l)) * .25 / max(sat(dot(n, v)), .15); }
fn shade(alb: vec3f, n: vec3f, p: vec3f, rough: f32, spec: f32, sh: f32, ao: f32) -> vec3f {
  let V = normalize(g.cam.xyz - p); let L = normalize(KEY);
  var c = alb * (vec3f(3.2, 3.05, 2.8) * sat(dot(n, L)) * sh + env(n) * .35 * ao);
  c += vec3f(3.2, 3.05, 2.8) * ggx(n, V, L, rough) * sh * spec * 1.6;
  let r = reflect(-V, n);
  c += env(r) * fres(.04, dot(n, V)) * spec * mix(.12, 1., 1. - rough) * ao;
  return c;
}
`;
// ---------------------------------------------------------------- turned parts: the piece (outer, bore, ends), chuck, tailstock
const HL_TURN = HL_G + /*wgsl*/`
override SEG: u32 = 160u;
override RINGS: u32 = 340u;
struct VO { @builtin(position) cp: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) lp: vec3f, @location(3) @interpolate(flat) part: u32 };
fn cor(k: u32) -> vec2u { return vec2u(u32(k == 1u || k == 4u || k == 5u), u32(k == 2u || k == 3u || k == 5u)); }
// part: 0 piece outer, 1 bore, 2 end face at 17 (annulus), 3 end face at 0, 4 chuck, 5 jaws, 6 tailstock centre
fn prof(part: u32, u: f32, dr: ptr<function, f32>) -> vec2f {   // (x along the axis in piece space, radius)
  switch part {
    case 0u { let x = u * 17.; *dr = (pieceR(x + .02) - pieceR(x - .02)) / .04; return vec2f(x, pieceR(x)); }
    case 1u { let x = mix(17., .5, u); *dr = 0.; return vec2f(x, 2.4); }
    case 2u { *dr = 1e3; return vec2f(17., mix(pieceR(17.), 2.4, u)); }
    case 3u { *dr = -1e3; return vec2f(0., mix(0., pieceR(0.), u)); }
    case 4u { let x = mix(-7.5, -.6, u); let r = select(select(5.2, 4.6, u > .55), 3.2, u < .12); *dr = 0.; return vec2f(x, r); }
    case 6u { let x = mix(16.4, 26., u); var r = 1.25; if (u < .12) { r = mix(.35, 2.38, u / .12); } else if (u > .55) { r = 3.1; } *dr = 0.; return vec2f(x, r); }
    default { return vec2f(0.); }
  }
}
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
  let q = vi / 6u; let c = cor(vi % 6u);
  let s = q % SEG + c.x; let r = q / SEG + c.y;
  let part = ii;
  let u = f32(r) / f32(RINGS);
  var dr = 0.;
  let pr = prof(part, u, &dr);
  let a0 = f32(s) / f32(SEG) * 2. * PI;
  let spin = select(g.ex.x, g.ex.x * 0., part == 9u);
  let a = a0 + spin;
  let rad = vec3f(0., cos(a), sin(a));
  var n = normalize(vec3f(-dr, 1., 0.));
  if (abs(dr) > 100.) { n = vec3f(sign(dr), 0., 0.); }
  var wn = vec3f(n.x, n.y * rad.y, n.y * rad.z);
  if (part == 1u) { wn = -rad; }
  let wp = vec3f(pr.x - 8.5, 0., 0.) + rad * pr.y;
  var o: VO; o.cp = g.vp * vec4f(wp, 1.); o.wp = wp; o.n = wn; o.lp = vec3f(pr.x, a0, pr.y); o.part = part; return o;
}
@vertex fn vsSh(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> @builtin(position) vec4f {
  let q = vi / 6u; let c = cor(vi % 6u);
  let s = q % SEG + c.x; let r = q / SEG + c.y;
  var dr = 0.; let pr = prof(ii, f32(r) / f32(RINGS), &dr);
  let a = f32(s) / f32(SEG) * 2. * PI + g.ex.x;
  return g.sm * vec4f(vec3f(pr.x - 8.5, 0., 0.) + vec3f(0., cos(a), sin(a)) * pr.y, 1.);
}
fn sdSeg2(p: vec2f, a: vec2f, b: vec2f) -> f32 { let pa = p - a; let ba = b - a; return length(pa - ba * sat(dot(pa, ba) / dot(ba, ba))); }
fn sdLeaf2(p: vec2f, a: vec2f, dir: vec2f, len: f32, w: f32) -> f32 {
  let t = vec2f(-dir.y, dir.x); let q = vec2f(dot(p - a, dir), dot(p - a, t)); let x = sat(q.x / len);
  return max(abs(q.y) - w * sin(PI * pow(x, .65)), max(-q.x, q.x - len));
}
// the engraving: a bamboo sprig and two rings (s: around the bottle, y: along it); the seed varies each bottle
fn engr(s: f32, y: f32) -> vec2f {
